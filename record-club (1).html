<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>RECORD CLUB</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c2b;--pan:#16143f;--line:#3b36a3;--pur:#6c3fc9;--yel:#ffc93c;--pink:#ff5fa2;--ink:#070619;--tx:#f1eeff;--mut:#9d98d6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(circle at 50% 0,#251d6a,var(--bg) 60%) fixed;color:var(--tx);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:12px}
.px{background:linear-gradient(#1a1850,#121036);border:2px solid var(--line);border-radius:6px;box-shadow:0 0 0 2px var(--ink),0 0 16px rgba(108,63,201,.3)}
.btn{background:linear-gradient(#ffd75a,#f2ad1f);color:#2a1a00;border:2px solid #7a4d00;border-radius:4px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 #7a4d00}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #7a4d00}
.btn.dim{background:#232063;color:var(--tx);border-color:var(--line);box-shadow:0 3px 0 var(--ink)}
.btn.out{background:#0e0c2b;color:var(--tx);border-color:#d9b24a;box-shadow:0 3px 0 var(--ink)}
.btn.alt{background:linear-gradient(#ff86bb,#e0407f);color:#fff;border-color:#7a1a45;box-shadow:0 3px 0 #7a1a45}
.btn:disabled{background:#3a3670;color:#8f8ac4;border-color:#2a2760;box-shadow:none;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}.btn.big{width:100%;padding:13px;font-size:19px}
.f{font-family:'Press Start 2P',monospace}
.up{color:#7dffb0}.dn{color:#ff8a9c}.y{color:var(--yel)}.muted{color:var(--mut)}
/* title */
.title{position:relative;min-height:calc(100vh - 32px);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 0 22px}
.title canvas.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;object-fit:cover}
.title>*:not(canvas){position:relative}
.neon{margin-top:18vh;padding:20px 26px 18px;text-align:center;border:3px solid #ff2d8f;border-radius:50% 50% 14px 14px/38% 38% 14px 14px;background:rgba(18,8,40,.78);box-shadow:0 0 18px #ff2d8f,inset 0 0 16px rgba(255,45,143,.7)}
.neon b{display:block;font-family:'Press Start 2P',monospace;font-size:clamp(28px,8vw,44px);line-height:1.3;color:#ffd23c;text-shadow:3px 3px 0 #c2185b,0 0 14px #ff2d8f}
.sub2{margin-top:-60px;background:rgba(10,6,30,.85);border:2px solid var(--line);padding:3px 14px;font-size:13px;letter-spacing:.12em;color:#bfe9ff}
.tbtn{width:min(86%,360px);display:flex;flex-direction:column;gap:10px;align-items:center}
.tbtn nav button{background:none;border:0;color:#9fb4ff;font-size:15px;padding:6px 10px}
/* play */
.top{display:grid;grid-template-columns:1.3fr 1fr 1.4fr .9fr .9fr;gap:6px;padding:8px;margin-bottom:10px}
@media(max-width:560px){.top{grid-template-columns:1fr 1fr 1fr}.top .lg{grid-column:1/-1}}
.lg{display:flex;align-items:center;gap:8px}
.disc{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,var(--yel) 0 18%,#111 20% 28%,transparent 30%),repeating-radial-gradient(#0d0d1a 0 2px,#2a2850 2px 4px);border:2px solid var(--ink);flex:none}
.logo{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5;color:var(--yel);text-shadow:2px 2px 0 #c2185b}
.st{background:rgba(7,6,25,.7);border:0;border-left:2px solid var(--line);padding:4px 8px;text-align:left;min-width:0}
.st small{display:block;color:var(--mut);font-size:11px}.st b{font-size:15px;font-weight:700;white-space:nowrap}
.st.link{cursor:pointer}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:560px){.mk{grid-template-columns:1fr}}
.mi{padding:10px 12px}.mi h2,.pn h2{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--yel)}
.mi p{margin:6px 0 0;font-size:13px;color:#d4cff5}
.mrow{display:flex;align-items:center;gap:10px}.mrow b{font-size:20px}
.badge{background:var(--c);color:#1a0b3a;font-weight:700;font-size:18px;padding:2px 14px;border:2px solid var(--ink)}
.rk{display:flex;justify-content:space-between;font-size:14px;padding:1px 0}
.tabs{display:flex;gap:8px;margin:0 0 10px}
.tab{background:#1c1a57;border:2px solid var(--line);border-radius:4px;padding:7px 14px;font-weight:700;color:var(--mut)}
.tab.on{background:linear-gradient(#ffd75a,#f2ad1f);color:#2a1a00;border-color:#7a4d00}
.pn{padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hd h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{background:#0f0d33;border:2px solid #2d2988;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cv{width:100%;aspect-ratio:1;image-rendering:pixelated;display:block;border:2px solid var(--ink);background:var(--pan)}
.card .nm{font-size:14px;font-weight:700;line-height:1.25;min-height:2.5em;overflow-wrap:anywhere}
.tag{display:inline-block;background:var(--c);color:#12082c;padding:0 7px;font-size:11px;font-weight:700;border-radius:2px;width:max-content}
.meta{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.star{color:var(--yel)}.price{font-size:16px;font-weight:700;color:var(--yel)}
.empty{color:var(--mut);padding:14px;text-align:center;border:2px dashed var(--line);border-radius:4px}
.row{display:grid;grid-template-columns:56px 1fr;gap:10px;background:#0f0d33;padding:8px;margin-bottom:8px;border:2px solid #2d2988;border-radius:4px}
.row .cv{width:56px}.row .nm{overflow-wrap:anywhere;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--ink);padding:2px 8px;border-left:4px solid var(--c);font-size:12px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.mini{flex:none;width:52px;padding:0;background:none;border:2px solid var(--line);border-radius:3px}
.bot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px}
.bar{height:12px;background:var(--ink);border:2px solid var(--ink);border-radius:6px;overflow:hidden;min-width:160px;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(#ffd75a,#f2ad1f)}
.lnk{display:flex;gap:6px;margin-top:6px}
/* result */
.res{max-width:440px;margin:14px auto;padding:18px;text-align:center}
.res h1{margin:6px 0 0;font-size:30px;color:var(--yel);text-shadow:0 0 14px rgba(255,201,60,.5)}
.res .sb{color:var(--mut);margin-bottom:12px}
.box{text-align:left;background:#0f0d33;border:2px solid #2d2988;border-radius:4px;padding:10px 12px;margin-bottom:10px}
.box h2{margin:0 0 6px;font-size:15px;color:var(--yel)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #2d2988}
.ln.big{font-size:20px;font-weight:700;color:var(--yel);border:0}
.got{display:flex;gap:8px;justify-content:center;margin:6px 0}
.slot{width:76px;text-align:center;font-size:12px}.slot .cv{margin-bottom:3px}
.slot.q .cv{display:grid;place-items:center;font-size:26px;color:var(--mut)}
.slot .new{color:#7dffb0}
.res .btn.big{margin-top:8px}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(5,4,20,.78);display:grid;place-items:center;padding:16px;z-index:20}
.md{max-width:440px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.md h2{margin:0 0 10px;color:var(--yel);font-size:20px}
.md ol{padding-left:20px;margin:0 0 12px}.md li{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--pink);color:#1a0b3a;font-weight:700;border:2px solid var(--ink);border-radius:4px;padding:8px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ccard.lock .cv{filter:brightness(0) contrast(.6);opacity:.55}.ccard.own .cv{opacity:.65}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
const GEN=['재즈','록','팝','소울','시티팝'];
const GC={'재즈':'#4aa8ff','록':'#ff6a55','팝':'#ff5fa2','소울':'#ffc93c','시티팝':'#3de0c4'};
const CD={M:['민트',1.25],NM:['최상',1],VG:['양호',.8],G:['보통',.6]};
const RAR=['','흔함','레어','슈퍼레어','전설'];
// name, genre, base, rarity, motif, palette[bg1,bg2,fg,accent]
const R=[
['Midnight Blue Session','재즈',18000,2,'moon',['#10246b','#1b3a9a','#ffe27a','#9fd0ff']],
['Smoky Trumpet Club','재즈',24000,3,'sun',['#3a1c4a','#5b2a63','#ffb347','#ff7a59']],
['Blue Hour Quartet','재즈',52000,4,'diag',['#0c1c4d','#16307d','#4aa8ff','#ffe27a']],
['Neon Thunder','록',15000,1,'bolt',['#2a0e1f','#4a1230','#ffd23c','#ff4d4d']],
['Garage Heart Attack','록',32000,3,'tri',['#1a1a1a','#3a1212','#ff6a55','#f5f5f5']],
['Candy Crush Radio','팝',12000,1,'heart',['#ff9acb','#ffc2e0','#d6246e','#fff']],
['Pink Satellite','팝',21000,2,'diamond',['#5a2a9a','#7a3fd0','#ff5fa2','#fff2a0']],
['Velvet Sunday','소울',20000,2,'rings',['#4a1a2a','#6a2a3a','#ffc93c','#f4a259']],
['Golden Gospel Hour','소울',45000,4,'check',['#3b2a08','#5a4010','#ffd84a','#fff2b0']],
['Tokyo Night Drive','시티팝',26000,3,'city',['#1a1050','#3a1a7a','#ff5fa2','#ffe27a']],
['Palm Beach 1984','시티팝',14000,1,'palm',['#ff8a5c','#ffc46b','#1c6b5a','#3a1a5a']],
['Neon Rain Café','시티팝',38000,4,'wave',['#0e2a4a','#143e6a','#3de0c4','#ff5fa2']]];
const r100=n=>Math.round(n/100)*100,W=n=>n.toLocaleString('ko-KR')+'원';
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const $=s=>document.querySelector(s),KEY='recordclub_v1';
let S=null,tm;
function noise(x,y,r){return Math.abs(Math.sin(x*12.9898+y*78.233+r*37.7)*43758.5453)%1}
function px(m,x,y,r){const dx=x-7.5,dy=y-7.5,d=Math.hypot(dx,dy);
 switch(m){
 case'sun':return d<4.5?2:y>10?(y%2?3:1):0;
 case'moon':return Math.hypot(dx,dy)<5.5&&!(Math.hypot(dx-2.5,dy+1.5)<4.5)?2:(noise(x,y,r)<.07?3:0);
 case'wave':return(y+Math.round(Math.sin(x/2.5)*2))%4<2?(y>8?3:2):1;
 case'city':{const h=5+((x>>1)*5+3)%7;if(y>=16-h)return(x%2==0&&y%2==0)?3:2;return d<3&&y<8?3:(y%5==0?1:0)}
 case'bolt':{const s=y<8?10-y*.7:12-(y-7)*.9;return x>=Math.round(s)&&x<=Math.round(s)+3?2:(d<7?1:0)}
 case'heart':{const X=dx/5.2,Y=-dy/5.2+.1,v=Math.pow(X*X+Y*Y-1,3)-X*X*Y*Y*Y;return v<0?2:((x+y)%5==0?1:0)}
 case'diamond':{const a=Math.abs(dx)+Math.abs(dy);return a<6?(a<3?3:2):((x+y)%2?0:1)}
 case'rings':return d<1.5?3:d>8?1:(Math.floor(d)%2?2:0);
 case'palm':{const ax=Math.abs(dx);if(x>=7&&x<=8&&y>=7)return 2;if(ax<6.5&&y>=3+ax*.5&&y<=5+ax*.7)return 2;return y>13?3:(y>9?1:0)}
 case'diag':return(x+y)%6<3?2:((x-y+16)%8<2?3:0);
 case'check':return(((x>>2)+(y>>2))%2)?(d<4?3:2):(d<4?2:(d>9?1:0));
 case'tri':return y>=3&&y<13&&Math.abs(dx)<=(y-3)*.55?(y>9?3:2):(y>13?1:0);}
 return 0}
function draw(cv){const rid=+cv.dataset.r,[n,g,b,ra,m,p]=R[rid],c=cv.getContext('2d');
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){c.fillStyle=p[px(m,x,y,rid)];c.fillRect(x,y,1,1)}}
function cover(rid,cls){return`<canvas class="cv ${cls||''}" width="16" height="16" data-r="${rid}"></canvas>`}
function scene(c){c.width=80;c.height=120;const x=c.getContext('2d'),f=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(a|0,b|0,w,h)};
 f('#241747',0,0,80,120);
 ['#3a2a7a','#6a3a9a','#b04a8a','#ff7a5c','#ffb35c'].forEach((col,i)=>f(col,4,5+i*5,32,5));
 for(let i=0;i<10;i++){const h=6+(i*7)%11,bx=4+i*3.2;f('#1a1040',bx,30-h,3,h);for(let j=0;j<h-2;j+=3)f('#ffc93c',bx+1,30-h+1+j,1,1)}
 f('#120c30',3,4,1,27);f('#120c30',3,4,34,1);f('#120c30',36,4,1,27);f('#120c30',3,30,34,1);f('#120c30',19,4,1,27);
 f('#3a2a1a',40,0,40,70);f('#2a1c10',40,0,1,70);
 const cl=['#ff5fa2','#ffc93c','#6c3fc9','#3de0c4','#f3eeff','#ff6a55','#4aa8ff'];
 [8,26,44].forEach(sy=>{for(let i=0;i<17;i++){const h=8+(i*3)%4;f(cl[(i*3+sy)%7],42+i*2,sy+13-h,2,h)}f('#5a3a2a',41,sy+13,39,2)});
 f('#6a4a30',49,4,14,12);f('#e8d9a8',50,5,12,10);f('#7a5a30',52,8,8,1);f('#7a5a30',52,11,6,1);
 f('#0a0614',20,0,1,13);f('#ffc93c',15,13,11,4);f('#fff2a0',17,17,7,2);x.fillStyle='rgba(255,210,90,.12)';x.fillRect(4,19,34,40);
 f('#3a2318',0,72,80,48);
 for(let r=0;r<2;r++)for(let i=0;i<20;i++){const h=5+(i*5+r*3)%4;f(cl[(i+r*2)%7],2+i*4,74+r*14+(8-h),3,h+2)}
 f('#6a4a30',0,84,80,2);f('#6a4a30',0,98,80,2);
 f('#4a2f66',0,100,80,20);f('#3a2a6e',10,96,50,16);f('#0a0922',13,94,38,3);f('#1a1a2e',20,86,24,10);f('#ff5fa2',29,90,6,4);f('#d9d9e8',52,90,1,8);f('#d9d9e8',48,98,5,1)}
/* ---------- state ---------- */
function mkMarket(){const pop=pick(GEN),sl=pick(GEN.filter(g=>g!=pop)),m={};
 GEN.forEach(g=>m[g]=+(g==pop?1+rnd(.15,.3):g==sl?1-rnd(.1,.2):1+rnd(-.05,.08)).toFixed(2));S.mult=m;S.pop=pop;S.slump=sl}
function mkShop(){const ids=R.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,6);
 S.shop=ids.map(rid=>{const c=pick(['M','NM','NM','VG','VG','G']),deal=rnd(.88,1.08);
  return{uid:S.uid++,rid,c,price:r100(R[rid][2]*CD[c][1]*S.mult[R[rid][1]]*deal)}})}
function mkGoal(){const cnt={};S.shop.forEach(s=>cnt[R[s.rid][1]]=(cnt[R[s.rid][1]]||0)+1);
 const ok=GEN.filter(g=>cnt[g]>=2);const g=ok.includes(S.pop)?S.pop:(ok.length?pick(ok):S.pop);
 S.goal={g,n:cnt[g]>=2?2:1,bonus:5000}}
function newGame(){S={screen:'play',day:1,money:50000,start:50000,actions:5,uid:1,owned:[],col:{},log:[],settle:null,modal:null,back:'play'};
 mkMarket();mkShop();mkGoal();save();render()}
const val=it=>r100(R[it.rid][2]*CD[it.c][1]*S.mult[R[it.rid][1]]);
const goalCount=()=>{const s=new Set(Object.keys(S.col).map(Number));S.owned.forEach(o=>s.add(o.rid));return[...s].filter(r=>R[r][1]==S.goal.g).length};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function toast(t){const e=$('#toast');e.textContent=t;e.className='show';clearTimeout(tm);tm=setTimeout(()=>e.className='',1900)}
/* ---------- actions ---------- */
const A={
 start(){newGame()},
 cont(){const s=load();if(s){S=s;S.modal=null;S.screen=['play','result'].includes(S.screen)?S.screen:'play';render()}},
 how(){S.modal={t:'how'};render()},
 close(){S.modal=null;render()},
 col(){S.back=S.screen;S.screen='col';render()},
 back(){S.screen=S.back=='col'?'play':S.back;if(S.screen=='title')S.screen='title';render()},
 title(){S.screen='title';save();render()},
 buy(u){const it=S.shop.find(s=>s.uid==u);if(!it)return toast('이미 팔린 레코드예요');
  if(S.actions<1)return toast('행동 횟수가 없어요. 하루를 마감하세요');
  if(S.money<it.price)return toast('자금이 부족해요');
  S.money-=it.price;S.actions--;S.shop=S.shop.filter(s=>s.uid!=u);
  S.owned.push({uid:u,rid:it.rid,c:it.c,paid:it.price});
  S.log.push({t:'buy',rid:it.rid,c:it.c,amt:it.price});toast(R[it.rid][0]+' 구매 완료!');save();render()},
 sell(u){const it=S.owned.find(o=>o.uid==u);if(!it)return toast('소유하지 않은 레코드예요');
  if(it.reg)return toast('컬렉션에 등록된 레코드는 팔 수 없어요');
  if(S.actions<1)return toast('행동 횟수가 없어요');
  const v=val(it);S.money+=v;S.actions--;S.owned=S.owned.filter(o=>o.uid!=u);
  S.log.push({t:'sell',rid:it.rid,c:it.c,amt:v});toast(`${W(v)}에 판매했어요`);S.modal=null;save();render()},
 reg(u){const it=S.owned.find(o=>o.uid==u);if(!it)return;
  if(S.col[it.rid])return toast('이미 컬렉션에 있는 레코드예요');
  S.col[it.rid]=1;it.reg=true;toast('컬렉션에 등록했어요!');save();render()},
 info(u){S.modal={t:'info',u:+u};render()},
 end(){const buy=S.log.filter(l=>l.t=='buy').reduce((a,l)=>a+l.amt,0),sell=S.log.filter(l=>l.t=='sell').reduce((a,l)=>a+l.amt,0);
  const cnt=goalCount(),met=cnt>=S.goal.n,bonus=met?S.goal.bonus:0;S.money+=bonus;
  S.settle={day:S.day,start:S.start,buy,sell,bonus,end:S.money,goal:S.goal,cnt,met,got:S.log.filter(l=>l.t=='buy').map(l=>({rid:l.rid,c:l.c}))};
  S.screen='result';save();render()},
 next(){S.day++;S.actions=5;S.start=S.money;S.log=[];S.settle=null;mkMarket();mkShop();mkGoal();S.screen='play';save();render();scrollTo(0,0)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 if(e.target.classList.contains('ov')&&!b)return;A[b.dataset.a](b.dataset.u)});
/* ---------- views ---------- */
const pips=n=>Array.from({length:5},(_,i)=>`<span class="pip ${i<n?'':'off'}"></span>`).join('');
const nCol=()=>Object.keys(S.col).length;






const pad=n=>String(n).padStart(2,'0');
A.tab=u=>{S.tab=u;render()};A.main=()=>A.title();
function topBar(){return`<header class="top px"><div class="lg"><i class="disc"></i><div class="logo">RECORD<br>CLUB</div></div><div class="st"><small>📅 날짜</small><b>DAY ${pad(S.day)}</b></div><div class="st"><small>🪙 보유 자금</small><b class="y">₩ ${S.money.toLocaleString('ko-KR')}</b></div><div class="st"><small>⚡ 남은 행동</small><b>${S.actions}/5</b></div><button class="st link" data-a="col"><small>📀 컬렉션</small><b>${nCol()}/${R.length}</b></button></header>`}
function market(){const p=S.pop,sl=S.slump,v=Math.round((S.mult[p]-1)*100),sv=Math.round((S.mult[sl]-1)*100),rk=[...GEN].sort((a,b)=>S.mult[b]-S.mult[a]);
 return`<section class="mk"><div class="px mi"><h2>오늘의 시장 정보</h2><div class="mrow"><span class="badge" style="--c:${GC[p]}">${p}</span><b class="up">▲ +${v}%</b></div><p>${p} 레코드의 수요가 늘어 가격이 올랐어요. ${sl}은(는) <span class="dn">${sv}%</span>로 내렸어요.</p></div><div class="px mi"><h2>장르별 시세 (인기순)</h2>${rk.map((g,i)=>{const t=Math.round((S.mult[g]-1)*100);return`<div class="rk"><span>${i+1}. <i style="color:${GC[g]};font-style:normal">♫</i> ${g}</span><b class="${t>=0?'up':'dn'}">${t>=0?'▲ +':'▼ '}${t}%</b></div>`}).join('')}</div></section>`}
function card(s){const [n,g,b,ra]=R[s.rid],dis=S.actions<1||S.money<s.price;
 return`<article class="card">${cover(s.rid)}<div class="nm">${n}</div><span class="tag" style="--c:${GC[g]}">${g}</span><div class="price">₩ ${s.price.toLocaleString('ko-KR')}</div><div class="meta"><span>상태: ${CD[s.c][0]}</span></div><div class="meta"><span>희소성: <span class="star">${'★'.repeat(ra)}</span> ${RAR[ra]}</span></div><button class="btn sm" data-a="buy" data-u="${s.uid}" ${dis?'disabled':''}>${S.actions<1?'행동 없음':S.money<s.price?'자금 부족':'구매하기'}</button></article>`}
function ownedRow(o){const [n,g]=R[o.rid],v=val(o);
 return`<div class="row">${cover(o.rid)}<div><div class="nm">${n}</div><div class="meta"><span class="tag" style="--c:${GC[g]}">${g}</span><span>${CD[o.c][0]}</span><span>예상 가치 <b class="y">${W(v)}</b></span></div><div class="acts"><button class="btn dim sm" data-a="info" data-u="${o.uid}">정보</button>${o.reg?'<span class="chip" style="--c:#7dffb0">🔒 컬렉션 등록됨</span>':`<button class="btn sm" data-a="sell" data-u="${o.uid}" ${S.actions<1?'disabled':''}>판매하기</button><button class="btn alt sm" data-a="reg" data-u="${o.uid}">수집 등록</button>`}</div></div></div>`}
function play(){const g=S.goal,c=Math.min(goalCount(),g.n),tab=S.tab||'shop';
 const strip=S.owned.length?S.owned.map(o=>`<button class="mini" data-a="info" data-u="${o.uid}" aria-label="${R[o.rid][0]} 정보">${cover(o.rid)}</button>`).join(''):'<span class="muted">아직 비어 있어요</span>';
 const body=tab=='shop'?(S.shop.length?`<div class="grid">${S.shop.map(card).join('')}</div>`:'<div class="empty">오늘 상점의 레코드를 모두 샀어요. 하루를 마감해 보세요!</div>'):(S.owned.length?S.owned.map(ownedRow).join(''):'<div class="empty">보유한 레코드가 없어요. 판매 레코드 탭에서 하나 골라 보세요.</div>');
 return topBar()+market()+`<div class="tabs"><button class="tab ${tab=='shop'?'on':''}" data-a="tab" data-u="shop">판매 레코드</button><button class="tab ${tab=='own'?'on':''}" data-a="tab" data-u="own">내 보유 레코드 (${S.owned.length})</button></div><section class="px pn">${body}</section><section class="px pn"><div class="hd"><h2>보유 레코드</h2><button class="btn dim sm" data-a="tab" data-u="own">전체 보기 ›</button></div><div class="strip">${strip}</div></section><footer class="px bot"><div style="flex:1;min-width:220px"><div>🎯 오늘의 수집 목표: <b class="y">${g.g} 레코드 ${g.n}장 모으기</b> (${c}/${g.n})</div><div class="bar"><i style="width:${c/g.n*100}%"></i></div><small class="muted">${S.actions>0?`행동 ${S.actions}번 남았어요. 달성하면 보너스 ${W(g.bonus)}!`:'행동을 모두 썼어요. 하루를 마감해 주세요.'}</small><div class="lnk"><button class="btn dim sm" data-a="how">게임 방법</button><button class="btn dim sm" data-a="main">메인 화면</button></div></div><button class="btn alt" data-a="end">하루 마감</button></footer>`}
function result(){const s=S.settle,L=(a,b,c)=>`<div class="ln ${c||''}"><span>${a}</span><span>${b}</span></div>`;
 const slots=s.got.slice(0,3).map(g=>`<div class="slot">${cover(g.rid)}<div>${R[g.rid][0]}</div><div class="${S.col[g.rid]?'new':''}">${S.col[g.rid]?'컬렉션 등록':'보유 중'}</div></div>`).concat(Array.from({length:Math.max(0,3-s.got.length)},()=>'<div class="slot q"><div class="cv">?</div><div>미발견</div></div>')).join('');
 return`<div class="res px"><div class="y">✦ 💿 ✦</div><h1>하루 종료</h1><div class="sb">DAY ${s.day} 결산</div>
 <div class="box"><h2>거래 결과</h2>${L('시작 자금',W(s.start))}${L('구매 금액','<span class="dn">- '+W(s.buy)+'</span>')}${L('판매 수익','<span class="up">+ '+W(s.sell)+'</span>')}${L('목표 보너스',s.met?'<span class="up">+ '+W(s.bonus)+'</span>':'없음')}${L('현재 자금',W(s.end),'big')}</div>
 <div class="box"><h2>오늘의 수집 목표</h2><div>${s.goal.g} 레코드 ${s.goal.n}장 모으기 — ${s.met?'<b class="up">달성!</b>':'<b class="dn">미달성</b>'}</div><div class="bar"><i style="width:${Math.min(s.cnt,s.goal.n)/s.goal.n*100}%"></i></div><div class="muted" style="text-align:right">진행 상황 ${Math.min(s.cnt,s.goal.n)} / ${s.goal.n}</div></div>
 <div class="box"><h2>오늘의 수집 결과</h2><div class="got">${slots}</div><div class="muted" style="text-align:center">컬렉션 진행 ${nCol()} / ${R.length} · ${s.got.length?'오늘도 좋은 거래였어요! 🎵':'내일은 한 장 데려와 볼까요?'}</div></div>
 <button class="btn big" data-a="next">다음 날 ▶</button><button class="btn big out" data-a="main">메인 화면</button></div>`}
function titleV(){const has=!!load();
 return`<div class="title px"><canvas class="bg"></canvas><div class="neon"><b>RECORD</b><b>CLUB</b></div><div class="sub2">VINTAGE VINYL TRADING</div><div class="tbtn">${has?'<button class="btn big" data-a="cont">이어하기 ▶</button>':''}<button class="btn big ${has?'dim':''}" data-a="start">${has?'새 게임':'게임 시작 ▶'}</button><button class="btn big out" data-a="how">게임 방법</button><nav><button data-a="colT">컬렉션</button></nav></div></div>`}
function collection(){const own=new Set(S.owned.map(o=>o.rid));
 return`<div class="pn px" style="margin-top:6px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">컬렉션 ${nCol()} / ${R.length}</h2><button class="btn sm" data-a="back">돌아가기</button></div><p style="color:var(--mut);margin:6px 0 12px">등록한 레코드는 컬러로, 보유만 한 레코드는 흐리게, 아직 못 만난 레코드는 실루엣으로 보여요.</p><div class="grid">${R.map((r,i)=>{const st=S.col[i]?'':own.has(i)?'own':'lock';
  return`<article class="card ccard ${st}" style="--c:${GC[r[1]]}">${cover(i)}<div class="nm">${st=='lock'?'???':r[0]}</div><div class="meta"><span class="tag">${r[1]}</span><span class="star">${'★'.repeat(r[3])}</span></div><div class="meta">${S.col[i]?'✔ 등록 완료':st=='own'?'보유 중 (미등록)':'미수집'}</div></article>`}).join('')}</div></div>`}

A.colT=function(){const s=load();if(!s)return toast('저장된 게임이 없어요. 먼저 게임을 시작하세요');S=s;S.modal=null;S.back='title';S.screen='col';render()};
function modal(){if(!S.modal)return'';
 if(S.modal.t=='how')return`<div class="ov"><div class="md px"><h2>게임 방법</h2><ol><li>상점의 레코드를 <b>구매</b>해 보유 목록에 담아요. 구매·판매는 행동 1회를 써요.</li><li>하루에 행동은 <b>5번</b>이에요. 다 쓰면 <b>하루 마감</b>을 눌러요.</li><li>장르마다 오늘의 시세가 달라요. 인기 장르는 오르고, 판매가는 보유 레코드의 예상 가치와 같아요.</li><li><b>컬렉션 등록</b>은 행동을 쓰지 않아요. 같은 레코드는 한 번만 등록되고, 등록한 레코드는 팔 수 없어요.</li><li>오늘의 목표를 이루면 보너스 5,000원을 받아요. 진행 상황은 자동 저장돼요.</li></ol><button class="btn" data-a="close">알겠어요</button></div></div>`;
 const o=S.owned.find(x=>x.uid==S.modal.u);if(!o){S.modal=null;return''}const [n,g,b,ra]=R[o.rid],v=val(o),d=v-o.paid;
 return`<div class="ov"><div class="md px"><h2>${n}</h2><div style="width:140px;margin-bottom:10px">${cover(o.rid)}</div><div class="ln"><span>장르</span><span style="color:${GC[g]}">${g}</span></div><div class="ln"><span>희소성</span><span class="star">${'★'.repeat(ra)} ${RAR[ra]}</span></div><div class="ln"><span>상태</span><span>${CD[o.c][0]}</span></div><div class="ln"><span>구매가</span><span>${W(o.paid)}</span></div><div class="ln"><span>현재 예상 가치</span><span class="y">${W(v)}</span></div><div class="ln"><span>예상 손익</span><span class="${d>=0?'up':'dn'}">${d>=0?'+':''}${W(d)}</span></div><div class="acts" style="margin-top:12px">${o.reg?'<span class="chip" style="--c:#7dffb0">🔒 컬렉션 등록됨</span>':`<button class="btn sm" data-a="sell" data-u="${o.uid}" ${S.actions<1?'disabled':''}>판매</button><button class="btn alt sm" data-a="reg" data-u="${o.uid}">컬렉션 등록</button>`}<button class="btn dim sm" data-a="close">닫기</button></div></div></div>`}
function render(){if(!S){S={screen:'title',modal:null,back:'title'}}
 const v=S.screen,html=v=='title'?titleV():v=='play'?play():v=='result'?result():v=='col'?collection():'';
 $('#app').innerHTML=html+modal();
 document.querySelectorAll('canvas.cv').forEach(draw);const bg=$('canvas.bg');if(bg)scene(bg)}
render();
</script></body></html>
